[package]
name = "aynmsgui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Templates
askama = "0.12"
askama_axum = "0.4"

# Auth
bcrypt = "0.16"
htpasswd-verify = "0.3"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# SSE / streaming
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# UUID for operation IDs
uuid = { version = "1", features = ["v4"] }

# Async trait
async-trait = "0.1"

# Regex
regex = "1"

# Indexmap for ordered maps
indexmap = { version = "2", features = ["serde"] }

# ay* crate dependencies
aycallhome = { path = "../aycallhome" }
ayciam = { path = "../ayciam" }
aycfggen = { path = "../aycfggen" }
aycfgapply = { path = "../aycfgapply" }
aycfgprovision = { path = "../aycfgprovision" }
aycicdiff = { path = "../aycicdiff" }
ayiosupdate-lib = { path = "../ayiosupdate/crates/ayiosupdate-lib" }
ayclic = { path = "../ayclic/ayclic" }
aytextfsmplus = { path = "../ayclic/aytextfsmplus" }
aycalc = { path = "../aycalc" }

[dev-dependencies]
tempfile = "3"
